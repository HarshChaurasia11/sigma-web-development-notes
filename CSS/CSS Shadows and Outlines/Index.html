<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow and Outline</title>
    <style>
        .box{
            border:2px solid rgb(0, 0, 0);
            margin: 23px;
            box-shadow: 3px 2px 5px #12c3d0;
            border-radius: 42px; /* Border ko curve karna ka liya */
        }
        p{
            text-shadow: 3px 2px 4px #12d01c;   
            outline: 2px solid black;
            outline-offset: 5px;         
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Nemo odio est iste consequuntur, obcaecati molestiae amet aperiam et repudiandae maxime alias quia ducimus, eaque tempore?
    </p>
</body>
</html>
