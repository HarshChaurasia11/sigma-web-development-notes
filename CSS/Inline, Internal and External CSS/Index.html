<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline, Internal and External CSS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .internal {
            background-color: rgb(10, 208, 60);
        }
    </style>
</head>

<body>
    <h1 style="color: yellow; background-color: blue;">
        Three ways to add CSS
    </h1>
    <ol>
        <li style="color: cyan;">
            Inline CSS - This is used in an HTML page using style attributes.
        </li>
        <li class="internal">
            Internal CSS - Its means to add a style tag and place the HTML page's style with in.
        </li>
        <li class="external">
            External CSS - It means to create a .css file and place all your styles inside that .css file
        </li>
    </ol>

</body>

</html>
