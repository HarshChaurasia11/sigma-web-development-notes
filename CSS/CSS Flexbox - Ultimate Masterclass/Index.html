<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container {
            border: 2px solid;
            display: flex;
            height: 455px;
            /* justify-content: center; */
            align-items: center;
            /* align-items: it is used only one line content */
            /* flex-direction: column; */
            flex-wrap: wrap;
            /* align-content: flex-start; */
            /* align-content: it is used multiple line content */
            /* there is no justify-items in flexbox; */
            flex-flow: row wrap;
            gap: 40px 10px;
        }

        .items {
            /* flex-grow: 1; */
            height: 60px;
            width: 60px;
            background-color: rgb(192, 23, 234);
            border: 2px solid black;
            /* margin: 5px; */    
        }

        .item1{
            /* flex-grow: 2; */
            flex-shrink: 2;
            align-self: flex-end;
        }

        /* default order 0 hota hai */
        .order-1{
            order: 1;
            align-self: flex-start;
        }

        .order-2 {
            order: 2;
        }

        .order-3 {
            order: 3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items item1">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items">4</div>
        <div class="items order-1">5</div>
        <div class="items">6</div>
        <div class="items">7</div>


    </div>
</body>

</html>
