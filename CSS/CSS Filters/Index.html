<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img1{
            filter: brightness(122%) contrast(0.5);   
        }
        .img2{
            filter: invert(.21);
        }
        .img3{
            /* filter: grayscale(60%); */
            filter: sepia(100%);
        }

        
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTOqzGs5EHz56gKSQeXNcuUj5pkr4kCXu26kA&s" alt="">
        <img class="img2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCYfM_rpZmurwa6yRNBbCZL2U7k3Z_kuUAlw&s" alt="">
        <img class="img3" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTCb14hBnQxvtlR2kQtizq9DtGshOQuNaiIg&s" alt="">
    </div>
</body>
</html>
