<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: rgb(82, 229, 121);
            height: 80vh;
            width: 80vw;
        }

        .box{
            width: 50px;
            height: 50px;
            background-color: bisque;
            /* animation: harshKaAnimation;
            animation-duration: 3s;
            animation-iteration-count: 3;
            animation-timing-function: cubic-bezier(1, 0.02, 0.01, 1.01);
            animation-delay: 3s;
            animation-direction: reverse;
            animation-play-state: paused; */
            animation: harshKaAnimation 2s ease-in-out 3 forwards,
                       harsh2 3s ease-in-out 3s 1 ;
        }

        @keyframes harshKaAnimation {
            from{
                /* background-color: bisque; */
            }
            to{
                background-color: blueviolet;
                /* transform: translate(80vw); */
            }
        }

        @keyframes harsh2 {
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(220deg);
            }
            80%{
                transform: rotate(250deg);
            }
            100%{
                transform: rotate(300deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>
</html>
