<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BoxModal - Margin, Padding and Border</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .box{
            background-color: aqua;
        }
        .box1{
            color: yellow;
            padding: 5px;
            margin: 2px;
            border: 2px solid black;
            height: 50px;
            box-sizing: border-box;
        }
        .box2{
            color: red;
            padding: 5px;
            margin: 2px;
            border: 2px solid blue;
            height: 50px;
            box-sizing: border-box
        }
    </style>
</head>
<body>
    <div class="box box1">I am a box</div>
    <div class="box box2">I am another box</div>
</body>
</html>
