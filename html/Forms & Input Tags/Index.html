<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is develop to learn and practise of html forms and Input Tags">
    <title>Form & Input Tags</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
    <h1>FORM FOR A STUDENT</h1>
    <form action="post">
        <div>
            <label for="username">Name :</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <label for="gender">Gender :</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="">Subject :</label>
            <input type="checkbox" id="physics" name="subject" value="yes">
            <label for="physics">Physics </label>
            <input type="checkbox" id="chemistry" name="subject" value="yes">
            <label for="chemistry">Chemistry </label>
            <input type="checkbox" id="maths" name="subject" value="yes">
            <label for="maths">Maths </label>
        </div>
        <div>
            <label for="password">Password :</label>
            <input type="password" id="password" placeholder="Password">
        </div>
        <div>
            <label for="date">Date :</label>
            <input type="date" id="date">
        </div>
        <div>
            <label for="email">Email :</label>
            <input type="email" id="email">
        </div>
        <div>
            <label for="states">States :</label>
            <select name="States" id="states">
                <option value="" disabled selected>Select State</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="West Bengal">West Bengal</option>
            </select>
        </div>
        <div>
            <label for="comment">Comment :</label><br>
            <textarea name="Comment" id="comment" rows="1" cols="20" placeholder="Enter your Feedback"></textarea>
        </div>
        <div>
            <input type="button" id="button" value="Submit">
        </div>
    </form>
</body>

</html>
