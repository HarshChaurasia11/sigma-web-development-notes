<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmark Manager</title>
</head>
<body>
    <h1>My BookMarks</h1>
    <h2>Primary BookMarks</h2>
    <!-- I can use target = blank because I want to website open in next page -->
    <p><a target="_blank" href="https://www.google.com/">Google</a></p>
    <p><a target="_blank" href="https://www.github.com/">Github</a></p>
    <p><a target="_blank" href="https://www.facebook.com/">Facebook</a></p>
    <p><a target="_blank" href="https://www.chrome.com/">Chrome</a></p>
    <p><a target="_blaknk" href="https://www.meta.com/">Meta</a></p>
    <h2>Secondary BookMarks</h2>
    <p><a href="https://www.wikipedia.com/">Wikipedia</a></p>
    <p><a href="https://www.stackoverflow.com/">Stackoverflow</a></p>
</body>
</html>
