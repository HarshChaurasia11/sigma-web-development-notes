<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio & Video</title>
    <meta name="description" content="Collections of some Audio & Video">
    <style>
        audio {
            background-color: antiquewhite;
            border: 2px solid black;
        }

        video {
            border: 3px solid black;
        }
    </style>
</head>

<body>
    <h1>Collection of Audio & Video</h1>
    <h2>Audio</h2>
    <div>
        <audio src="1.mp3" controls loop></audio>
        <audio src="2.mp3" controls loop></audio>
        <audio src="3.mp3" controls loop></audio>
        <audio src="4.mp3" controls loop></audio>
        <audio src="5.mp3" controls loop></audio>
        <audio src="6.mp3" controls loop></audio>
    </div>
    <h2>Video</h2>
    <div>
        <video src="1.mp4" width="300" height="200" controls loop></video>
        <video src="5.mp4" width="300" height="200" controls loop></video>
        <video src="6.mp4" width="300" height="200" controls loop></video>
        <video src="2.mp4" width="300" height="200" controls loop></video>
        <video src="3.mp4" width="300" height="200" controls loop></video>
        <video src="4.mp4" width="300" height="200" controls loop></video>
    </div>
</body>

</html>
