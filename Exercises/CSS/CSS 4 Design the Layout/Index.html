<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design the Layout</title>
    <style>
        body {
            background-color: rgb(7, 7, 7);
        }

        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;

        }

        .boxes {
            list-style: none;
            display: flex;
            padding: 2;
            width: 100%;
            font-size: 25px;
            justify-content: space-evenly;
            background-color: rgb(252, 208, 215);

        }

        .div1 {
            display: flex;
            width: 98%;
            min-height: 80vh;
            margin: 0 1%;
            background-color: rgb(3, 137, 3);
            justify-content: space-evenly;
            margin-top: 10px;
        }

        .div2 {
            border: 2px solid black;
            margin: auto;
            width: 300px;
            height: 300px;
            background-color: rgb(216, 130, 144);
        }

        .div3 {
            background-color: rgb(110, 119, 220);
        }

        .cont {
            border: 2px solid white;
            color: rgb(250, 251, 251);
            background-color: rgb(52, 52, 52);
            padding: 30px;
            font-size: 45px;
            text-align: center;
            margin: 50px 100px;
            border-radius: 35px;
            /* box-shadow: 0 5px 20px rgba(31, 235, 8, 0.5); */
        }

        .foot {
            background-color: rgb(37, 202, 150);
            text-align: center;
            font-size: 30px;
            padding: 10px;
        }

        .log1 {
            background-color: blue;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: fixed;
            right: 10px;
            bottom: 10px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul class="boxes">
                <li class="box">Home</li>
                <li class="box">About</li>
                <li class="box">Services</li>
                <li class="box">Contact</li>
            </ul>
        </nav>
    </header>
    <div class="div1">
        <div class="div2"></div>
        <div class="div2 div3"></div>
    </div>
    <div class="log1">
         
    </div>
    <div class="cont">
        Welcome to this Sigma Web delevelopment Express
    </div>
    <footer class="foot">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Beatae, magni?
    </footer>
</body>

</html>
