<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: rgb(233, 136, 215);
            height: 40px;
        }

        body {
            background-color: black;
            color: white;
        }

        .container {
            background-color: rgb(33, 158, 33);
            margin: 12px 34px;
            text-align: center;
            padding: 55px 25px;
        }

        .box1 {
            background-color: rgb(244, 107, 153);
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0px 12px;
        }

        .box2 {
            background-color: rgb(69, 199, 250);
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0px 12px;
        }

        .text {
            padding: 34px;
            border: 1px solid white;
            border-radius: 25px;
            background-color: rgb(69, 67, 67);
            margin: 10px 25vw;
            text-align: center;
            font-size: 28px;
        }

        footer {
            height: 70px;
            background-color: rgb(247, 209, 161);
        }

        .orange {
            height: 62px;
            width: 62px;
            background-color: orange;
            border-radius: 50%;
            position: fixed;
            bottom: 10px;
            right: 20px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text">
            <p>
                Welcome to Sigma Web Development Course.
            </p>
        </div>
    </main>

    <div class="orange">

    </div>

    <footer>

    </footer>
</body>

</html>
