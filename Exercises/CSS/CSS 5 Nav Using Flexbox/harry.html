<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        .logo img{
            width: 100px;
            height: 53px;
            /* background-color: blue; */
            
        }

        nav{
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .right ul{
            display: flex;
            gap: 34px;
        }

        .right ul li{
            list-style: none;
            cursor: pointer;
            /* padding: 0px 20px; */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="">
            </div>
            
            <div class="right">
                <ul>
                    <li>Products</li>
                    <li>Pricing</li>
                    <li>Resources</li>
                    <li>About Us</li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
