<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            width: 70vw;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0px;
        }

        ul{
            list-style: none;
            display: flex;
            gap: 35px;
            
        }
        li{
            font-size: 20px;
            cursor: pointer;
        }

        main{
            text-align: center;
            box-sizing: border-box;
            width: 70vw;
            margin: auto;
            margin-top: 20px;
        }

        .hea{
            font-size: 40px;
        }

        p{
            font-size: 25px;
            padding: 10px;
        }

        button{
            padding: 10px;
            border-radius: 5px;
            color: white;
            background-color: rgb(35, 196, 224);
            border: none;
            margin-top: 10px;
        }
        
    </style>
</head>
<body>
    <header>
        <img src="logo.png" width="150" alt="">
        <ul>
            <li>Product ⌵ </li>
            <li>Pricing ⌵ </li>
            <li>Resources ⌵ </li>
            <li>About Us ⌵ </li>
        </ul>
    </header>
    <main>
        <div  class="hea">
            Download <b>UltraEdit</b> for Windows<img src="star.jpg" alt="" width="100">
        </div>
        <p>Download and try UltraEdit before you buy it! This download includes the full Window of the text Editor.</p>
        <button>DOWNLOAD MAC OR LINUX VERSION</button>
    </main>
</body>
</html>
