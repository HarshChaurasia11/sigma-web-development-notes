<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Card</title>
    <style>
        body {
            background-color: rgb(127, 127, 127);
        }

        .cord {
            background-color: white;
            border: 1px solid rgb(71, 70, 70);
            border-radius: 20px;
            width: 382px;
            height: 85vh;
            margin: auto;
        }

        .card {
            padding: 5px;
        }

        span {
            display: inline;
            margin: 10px;
            font-size: 22px;
            padding: 5px;
            border: 1px solid black;
            border-radius: 20px;
            box-shadow: inset 1px 1px 20px 9px rgb(189, 190, 190);

        }

        h2 {
            margin-left: 15px;
            font-size: 32px;
        }

        p {
            margin-left: 15px;
            font-size: 20px;
            color:gray
        }

        .inner {
            color: rgb(5, 122, 232);
            font-size: 22px;
            margin: 15px auto;
            border: 0.2px solid rgb(184, 188, 188);
            border-radius: 20px;
            padding: 5px;
            box-shadow: inset 1px 1px 20px 9px rgb(107, 159, 185);
            text-align: center;
            width: 135px;
            font-weight: bold;

        }
    </style>
</head>

<body>
    <div class="cord">
        <div class="card">
            <img src="Card.png" alt="" height="280" style="border-radius: 15px;">
        </div>
        <span>Nature</span>
        <span>Lake</span>
        <h2>Sea Side Resort</h2>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Minus nostrum tenetur quam veritatis asperiores.
            Quia magni rerum doloribus distinctio nemo nesciunt eos earum impedit.</p>
        <div class="inner">
            Read more
        </div>
    </div>
</body>

</html>
